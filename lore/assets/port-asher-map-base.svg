<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <!-- 做旧纸底 -->
    <radialGradient id="paperBg" cx="50%" cy="50%" r="78%">
      <stop offset="0%"  stop-color="#f3ebd0"/>
      <stop offset="55%" stop-color="#e8dcb1"/>
      <stop offset="100%" stop-color="#c8b685"/>
    </radialGradient>

    <!-- 暗角 -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="72%">
      <stop offset="60%"  stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#2a1f0a" stop-opacity="0.55"/>
    </radialGradient>

    <!-- 海洋 -->
    <linearGradient id="seaGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#7e9c97"/>
      <stop offset="100%" stop-color="#4d6663"/>
    </linearGradient>

    <!-- 河流 -->
    <linearGradient id="riverGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#6b8a86"/>
      <stop offset="100%" stop-color="#3e5754"/>
    </linearGradient>

    <!-- 公园绿地 -->
    <linearGradient id="parkGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#9aa66b"/>
      <stop offset="100%" stop-color="#7a8654"/>
    </linearGradient>

    <!-- 工业 / 港口 -->
    <linearGradient id="indGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#b39870"/>
      <stop offset="100%" stop-color="#8a7350"/>
    </linearGradient>

    <!-- 居住 / 商业区 -->
    <linearGradient id="urbanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#dccfa3"/>
      <stop offset="100%" stop-color="#c4b687"/>
    </linearGradient>

    <!-- 沙地 -->
    <linearGradient id="sandGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#d4be87"/>
      <stop offset="100%" stop-color="#b39d6a"/>
    </linearGradient>

    <!-- 纸张纹理 -->
    <filter id="paperTex" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="5"/>
      <feColorMatrix values="0 0 0 0 0.25
                             0 0 0 0 0.18
                             0 0 0 0 0.08
                             0 0 0 0.20 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>

    <clipPath id="mapClip">
      <rect x="0" y="0" width="1200" height="800" rx="4"/>
    </clipPath>
  </defs>

  <!-- 背景纸 -->
  <rect width="1200" height="800" fill="url(#paperBg)"/>

  <g clip-path="url(#mapClip)">

    <!-- ============ 海洋（右侧大块海岸）============ -->
    <path d="M 1200,0
             L 1200,800
             L 1010,800
             C 1000,720 990,650 1010,560
             C 1030,470 1070,400 1060,310
             C 1050,220 1030,140 1060,60
             C 1080,30 1140,10 1200,0 Z"
          fill="url(#seaGrad)" opacity="0.9"/>

    <!-- 浅海带 -->
    <path d="M 1200,120
             C 1130,150 1090,210 1085,290
             C 1080,370 1100,440 1075,520
             C 1055,590 1030,650 1050,740
             L 1200,780 Z"
          fill="#9eb6b0" opacity="0.5"/>

    <!-- 海面波纹（无规则、弯曲）-->
    <g stroke="#4d6663" stroke-width="0.7" fill="none" opacity="0.35">
      <path d="M 1080,90 q 15,-6 30,2 t 28,-4"/>
      <path d="M 1110,170 q 14,-5 28,3 t 26,-3"/>
      <path d="M 1095,260 q 16,-6 30,1 t 28,-2"/>
      <path d="M 1075,360 q 16,-6 30,2 t 28,-4"/>
      <path d="M 1060,460 q 14,-5 28,3 t 26,-3"/>
      <path d="M 1050,560 q 16,-6 30,1 t 28,-2"/>
      <path d="M 1040,660 q 16,-6 30,2 t 28,-4"/>
    </g>

    <!-- ============ 河流（贯穿南北，自然弯曲）============ -->
    <path d="M 360,0
             C 380,80 330,150 360,220
             C 390,290 440,340 410,410
             C 380,480 330,540 370,610
             C 400,670 380,740 410,800
             L 510,800
             C 480,740 510,670 480,610
             C 450,540 500,480 470,410
             C 440,340 490,290 460,220
             C 430,150 480,80 460,0 Z"
          fill="url(#riverGrad)" opacity="0.92"/>

    <!-- 河道水流细线 -->
    <path d="M 405,0 C 425,80 375,150 405,220
             C 435,290 485,340 455,410
             C 425,480 375,540 415,610
             C 445,670 425,740 455,800"
          fill="none" stroke="#3a504c" stroke-width="0.7" opacity="0.55"/>
    <path d="M 465,0 C 445,80 495,150 465,220
             C 435,290 385,340 415,410
             C 445,480 495,540 455,610
             C 425,670 445,740 415,800"
          fill="none" stroke="#3a504c" stroke-width="0.7" opacity="0.55"/>

    <!-- ============ 分区色块（不规则多边形）============ -->
    <!-- 北部居住区（东片） -->
    <path d="M 540,40 L 1040,40 L 1060,180
             L 1020,260 L 940,300 L 860,260
             L 780,290 L 700,250 L 620,280
             L 540,250 Z"
          fill="url(#urbanGrad)" opacity="0.65"/>

    <!-- 北部居住区（西片） -->
    <path d="M 40,40 L 350,40 L 360,180
             L 320,250 L 250,280 L 180,250
             L 110,280 L 40,240 Z"
          fill="url(#urbanGrad)" opacity="0.6"/>

    <!-- 中央商务区（核心，形状破碎） -->
    <path d="M 540,300 L 700,280 L 820,310 L 920,300
             L 980,340 L 1000,420 L 970,500
             L 900,540 L 800,550 L 700,540
             L 600,520 L 530,460 L 510,380 Z"
          fill="#e0d2a0" opacity="0.7"/>

    <!-- 港口 / 工业区（东南，不规则） -->
    <path d="M 990,360 L 1100,400 L 1110,500
             L 1070,580 L 980,560 L 940,500
             L 950,420 Z"
          fill="url(#indGrad)" opacity="0.7"/>

    <!-- 河西区（西南，斜切） -->
    <path d="M 40,290 L 350,290 L 360,420
             L 330,520 L 260,580 L 180,560
             L 100,590 L 40,540 Z"
          fill="url(#urbanGrad)" opacity="0.6"/>

    <!-- 河东南部居住区（南片，斜切） -->
    <path d="M 540,560 L 700,540 L 820,560
             L 940,560 L 980,640 L 950,720
             L 870,780 L 760,760 L 660,780
             L 560,740 L 510,660 Z"
          fill="url(#urbanGrad)" opacity="0.62"/>

    <!-- 西南部混合区 -->
    <path d="M 40,600 L 200,600 L 340,610
             L 360,720 L 320,780 L 220,790
             L 100,780 L 40,720 Z"
          fill="#d5c595" opacity="0.6"/>

    <!-- ===== 大型绿地公园（不规则） ===== -->
    <!-- 河西大公园 -->
    <path d="M 90,360 L 200,340 L 290,360
             L 320,420 L 290,500 L 200,520
             L 110,500 L 80,440 Z"
          fill="url(#parkGrad)" opacity="0.78"/>

    <!-- 中央公园 -->
    <path d="M 600,580 L 700,570 L 780,600
             L 780,660 L 700,680 L 600,660 Z"
          fill="url(#parkGrad)" opacity="0.7"/>

    <!-- 北部小公园 -->
    <path d="M 400,80 L 480,75 L 530,110
             L 510,160 L 440,170 L 390,130 Z"
          fill="url(#parkGrad)" opacity="0.65"/>

    <!-- 沙滩带 -->
    <path d="M 990,560 L 1080,580 L 1075,650
             L 1010,660 L 980,620 Z"
          fill="url(#sandGrad)" opacity="0.7"/>

    <!-- ============ 街道 ============ -->

    <!-- === 主干道（粗、深、最少） === -->
    <g stroke="#3a2f10" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.9">
      <!-- 滨河大道（沿河西） -->
      <path d="M 40,300 L 110,310 L 200,300 L 290,320 L 360,330"/>
      <!-- 中央东西主干道 -->
      <path d="M 40,440 L 110,430 L 200,440 L 290,425 L 360,440 L 540,430 L 700,425 L 860,440 L 980,430 L 1060,420"/>
      <!-- 中央南北主干道（贯穿全城）-->
      <path d="M 720,40 L 730,180 L 720,290 L 730,420 L 720,540 L 730,680 L 720,790"/>
      <!-- 滨河大道（河东岸）-->
      <path d="M 530,40 L 525,180 L 535,300 L 525,430 L 535,560 L 525,720 L 530,800"/>
      <!-- 滨海大道（沿海岸）-->
      <path d="M 800,40 L 820,180 L 850,300 L 880,440 L 910,560 L 940,680 L 970,790"/>
      <!-- 南部主干道 -->
      <path d="M 40,680 L 110,670 L 200,685 L 290,670 L 360,680 L 540,675 L 700,680 L 860,670 L 980,680 L 1020,690"/>
    </g>

    <!-- === 次干道（中等粗细、密一些、轻微斜角） === -->
    <g stroke="#5a4a26" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.78">
      <!-- 横向次干道 -->
      <path d="M 40,140 L 110,135 L 200,145 L 290,135 L 360,150 L 540,140 L 700,135 L 860,145 L 980,140"/>
      <path d="M 40,250 L 110,245 L 200,255 L 290,245 L 360,260 L 540,250 L 700,245 L 860,255 L 980,245"/>
      <path d="M 40,370 L 110,365 L 200,375 L 290,365 L 360,380 L 540,370 L 700,365"/>
      <path d="M 40,520 L 110,515 L 200,525 L 290,515 L 360,530 L 540,520 L 700,515 L 860,525 L 980,515"/>
      <path d="M 40,620 L 110,615 L 200,625 L 290,615 L 360,630 L 540,620 L 700,615 L 860,625 L 980,620"/>
      <path d="M 40,740 L 110,735 L 200,745 L 290,735 L 360,750 L 540,740 L 700,735 L 860,745 L 980,740"/>

      <!-- 纵向次干道（带轻微斜角）-->
      <path d="M 130,40 L 128,200 L 132,350 L 128,520 L 132,700 L 128,790"/>
      <path d="M 270,40 L 272,200 L 268,350 L 272,520 L 268,700 L 272,790"/>
      <path d="M 610,40 L 608,180 L 612,330 L 608,470 L 612,610 L 608,760 L 612,790"/>
      <path d="M 820,40 L 822,180 L 818,320 L 822,460 L 818,620 L 822,790"/>
      <path d="M 920,40 L 922,180 L 918,320 L 922,460 L 918,620 L 922,790"/>
    </g>

    <!-- === 小巷 / 街区路（细、最密、明显斜角） === -->
    <g stroke="#6b5a32" stroke-width="0.7" stroke-linecap="round" fill="none" opacity="0.55">
      <!-- 横向小巷（带轻微波浪）-->
      <path d="M 40,90  L 200,95  L 360,88"/>
      <path d="M 40,170 L 200,168 L 360,172"/>
      <path d="M 40,210 L 200,213 L 360,208"/>
      <path d="M 40,280 L 200,278 L 360,283"/>
      <path d="M 40,400 L 200,402 L 360,398"/>
      <path d="M 40,470 L 200,472 L 360,468"/>
      <path d="M 40,570 L 200,568 L 360,573"/>
      <path d="M 40,650 L 200,652 L 360,648"/>
      <path d="M 40,710 L 200,708 L 360,713"/>

      <!-- 北部横向小巷（不贯通）-->
      <path d="M 540,80  L 700,82  L 860,78"/>
      <path d="M 540,170 L 700,168 L 860,172"/>
      <path d="M 540,210 L 700,212 L 860,208"/>
      <path d="M 540,360 L 700,362 L 860,358"/>
      <path d="M 540,460 L 700,458 L 860,463"/>
      <path d="M 540,600 L 700,602 L 860,598"/>
      <path d="M 540,700 L 700,698 L 860,703"/>

      <!-- 纵向小巷（带斜角）-->
      <path d="M 60,40  L 62,200  L 58,350  L 62,520  L 58,700"/>
      <path d="M 170,40 L 168,200 L 172,350 L 168,520 L 172,700 L 168,790"/>
      <path d="M 230,40 L 232,200 L 228,350 L 232,520 L 228,700"/>
      <path d="M 310,40 L 312,200 L 308,350 L 312,520 L 308,700 L 312,790"/>

      <!-- 中央商务区小巷（密、斜角更多）-->
      <path d="M 560,40  L 562,160 L 558,300 L 562,440 L 558,580 L 562,720"/>
      <path d="M 580,40  L 582,160 L 578,300 L 582,440 L 578,580 L 582,720"/>
      <path d="M 650,40  L 648,160 L 652,300 L 648,440 L 652,580 L 648,720"/>
      <path d="M 680,40  L 682,160 L 678,300 L 682,440 L 678,580 L 682,720"/>
      <path d="M 750,40  L 748,160 L 752,300 L 748,440 L 752,580 L 748,720"/>
      <path d="M 780,40  L 782,160 L 778,300 L 782,440 L 778,580 L 782,720"/>

      <!-- 河东南小巷 -->
      <path d="M 850,40  L 852,160 L 848,300 L 852,440 L 848,580 L 852,720"/>
      <path d="M 880,40  L 878,160 L 882,300 L 878,440 L 882,580 L 878,720"/>
      <path d="M 950,40  L 952,160 L 948,300 L 952,440 L 948,580 L 952,720"/>

      <!-- 西南斜巷（更明显的斜角）-->
      <path d="M 80,610 L 90,720 L 85,790"/>
      <path d="M 140,600 L 152,720 L 148,790"/>
      <path d="M 230,610 L 240,720 L 235,790"/>
      <path d="M 300,600 L 310,720 L 305,790"/>

      <!-- 港口小巷（弯折）-->
      <path d="M 990,400 L 1030,410 L 1070,400"/>
      <path d="M 1000,460 L 1040,470 L 1080,460"/>
      <path d="M 1010,520 L 1050,530 L 1090,520"/>
    </g>

    <!-- ============ 桥梁（跨河）============ -->
    <g>
      <!-- 三座跨河桥 -->
      <rect x="385" y="135" width="120" height="14" fill="#5a4a26" opacity="0.9"/>
      <rect x="395" y="425" width="130" height="14" fill="#5a4a26" opacity="0.9"/>
      <rect x="395" y="670" width="120" height="14" fill="#5a4a26" opacity="0.9"/>
      <!-- 桥面分隔线 -->
      <line x1="445" y1="135" x2="445" y2="149" stroke="#f3ebd0" stroke-width="1.5"/>
      <line x1="460" y1="425" x2="460" y2="439" stroke="#f3ebd0" stroke-width="1.5"/>
      <line x1="455" y1="670" x2="455" y2="684" stroke="#f3ebd0" stroke-width="1.5"/>
    </g>

    <!-- ============ 海岸线 / 河道描边 ============ -->
    <!-- 海岸线 -->
    <path d="M 1010,800
             C 1000,720 990,650 1010,560
             C 1030,470 1070,400 1060,310
             C 1050,220 1030,140 1060,60
             C 1080,30 1140,10 1200,0"
          fill="none" stroke="#3a504c" stroke-width="2.5" opacity="0.85"/>

    <!-- 河道 -->
    <path d="M 360,0
             C 380,80 330,150 360,220
             C 390,290 440,340 410,410
             C 380,480 330,540 370,610
             C 400,670 380,740 410,800"
          fill="none" stroke="#2a3d3a" stroke-width="1.8" opacity="0.8"/>
    <path d="M 510,800
             C 480,740 510,670 480,610
             C 450,540 500,480 470,410
             C 440,340 490,290 460,220
             C 430,150 480,80 460,0"
          fill="none" stroke="#2a3d3a" stroke-width="1.8" opacity="0.8"/>

    <!-- ============ 少量建筑阴影块 ============ -->
    <g fill="#9a8452" opacity="0.32">
      <!-- 中央商务区 -->
      <rect x="600" y="370" width="32" height="22" transform="rotate(-2 616 381)"/>
      <rect x="650" y="390" width="28" height="26" transform="rotate(3 664 403)"/>
      <rect x="700" y="365" width="34" height="24" transform="rotate(-1 717 377)"/>
      <rect x="750" y="395" width="30" height="28" transform="rotate(2 765 409)"/>
      <rect x="800" y="375" width="32" height="22"/>
      <rect x="850" y="400" width="28" height="26" transform="rotate(-3 864 413)"/>
      <rect x="900" y="380" width="30" height="24"/>
      <rect x="620" y="450" width="26" height="22" transform="rotate(2 633 461)"/>
      <rect x="680" y="470" width="32" height="24"/>
      <rect x="740" y="455" width="28" height="26" transform="rotate(-2 754 468)"/>
      <rect x="800" y="470" width="30" height="22"/>
      <rect x="860" y="450" width="26" height="24" transform="rotate(3 873 462)"/>

      <!-- 港口仓库 -->
      <rect x="960" y="430" width="50" height="18"/>
      <rect x="960" y="455" width="50" height="18"/>
      <rect x="960" y="480" width="50" height="18"/>

      <!-- 北部住宅小块 -->
      <rect x="80" y="180" width="20" height="16"/>
      <rect x="120" y="200" width="22" height="14"/>
      <rect x="180" y="180" width="20" height="18"/>
      <rect x="240" y="200" width="24" height="16"/>
      <rect x="600" y="120" width="22" height="16"/>
      <rect x="680" y="140" width="20" height="18"/>
      <rect x="780" y="120" width="24" height="16"/>
      <rect x="860" y="140" width="22" height="18"/>

      <!-- 西南住宅 -->
      <rect x="80" y="660" width="22" height="16"/>
      <rect x="160" y="680" width="20" height="18"/>
      <rect x="240" y="660" width="24" height="16"/>
      <rect x="120" y="730" width="20" height="14"/>
      <rect x="220" y="740" width="22" height="16"/>

      <!-- 河东南住宅 -->
      <rect x="600" y="630" width="20" height="16"/>
      <rect x="680" y="650" width="22" height="18"/>
      <rect x="780" y="640" width="20" height="16"/>
      <rect x="860" y="660" width="24" height="18"/>
      <rect x="640" y="720" width="20" height="16"/>
      <rect x="740" y="730" width="22" height="14"/>
      <rect x="840" y="720" width="20" height="16"/>
    </g>

    <!-- ============ 树点（小点，公园里）============ -->
    <g fill="#5e6a3a" opacity="0.5">
      <circle cx="120" cy="380" r="2.5"/>
      <circle cx="140" cy="400" r="2"/>
      <circle cx="170" cy="390" r="2.5"/>
      <circle cx="200" cy="410" r="2"/>
      <circle cx="220" cy="430" r="2.5"/>
      <circle cx="250" cy="420" r="2"/>
      <circle cx="180" cy="460" r="2.5"/>
      <circle cx="220" cy="480" r="2"/>
      <circle cx="270" cy="460" r="2"/>

      <circle cx="620" cy="600" r="2.5"/>
      <circle cx="650" cy="620" r="2"/>
      <circle cx="680" cy="610" r="2.5"/>
      <circle cx="710" cy="640" r="2"/>
      <circle cx="740" cy="620" r="2.5"/>

      <circle cx="420" cy="100" r="2.5"/>
      <circle cx="450" cy="120" r="2"/>
      <circle cx="480" cy="110" r="2.5"/>
      <circle cx="430" cy="140" r="2"/>
    </g>

  </g>

  <!-- ============ 罗盘 + 比例尺（参考图样式）============ -->
  <g transform="translate(85,95)">
    <circle r="28" fill="#f3ebd0" stroke="#3a2f10" stroke-width="1.5" opacity="0.92"/>
    <path d="M 0,-22 L 6,4 L 0,-2 L -6,4 Z" fill="#3a2f10"/>
    <text y="-32" text-anchor="middle" font-size="11" fill="#3a2f10" font-weight="bold">N</text>
  </g>

  <g transform="translate(80,755)">
    <rect x="0"  y="0" width="40" height="6" fill="#3a2f10"/>
    <rect x="40" y="0" width="40" height="6" fill="#f3ebd0" stroke="#3a2f10" stroke-width="0.8"/>
    <rect x="80" y="0" width="40" height="6" fill="#3a2f10"/>
    <text x="0"   y="22" font-size="10" fill="#3a2f10">0</text>
    <text x="60"  y="22" font-size="10" fill="#3a2f10" text-anchor="middle">1 km</text>
    <text x="120" y="22" font-size="10" fill="#3a2f10" text-anchor="middle">2 km</text>
  </g>

  <!-- ============ 做旧 ============ -->
  <rect width="1200" height="800" fill="url(#paperBg)" filter="url(#paperTex)" opacity="0.45"/>
  <rect width="1200" height="800" fill="url(#vignette)"/>

  <g fill="#2a1f0a" opacity="0.18">
    <ellipse cx="0"    cy="0"    rx="50" ry="50"/>
    <ellipse cx="1200" cy="0"    rx="50" ry="50"/>
    <ellipse cx="0"    cy="800"  rx="50" ry="50"/>
    <ellipse cx="1200" cy="800"  rx="50" ry="50"/>
  </g>
  <rect width="1200" height="800" fill="none" stroke="#3a2f10" stroke-width="2" opacity="0.4" rx="4"/>
</svg>